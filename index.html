<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCCD Excel">

<title>CCCD sang Excel</title>
<style>
/*THEME*/:root{--bg:#0b4c3b;--card:#1a5645;--tx:#ffffff;--mu:#b3d0c4;--bd:#2f705e;--pr:#dcf763;--prt:#0b3d2f;--wa:#ffb454;--ok:#b6ec7a;--gold:#dcf763;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 85% 6%,#4d8a40 0,#176148 24%,transparent 58%),linear-gradient(180deg,#0e5a45,#0a4535 55%,#083a2c) fixed var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
.hd{background:linear-gradient(135deg,#0a4535,#1b6b4f);border-bottom:4px solid var(--gold);color:#fff}
.hd .in{max-width:900px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{color:#fff;font-size:20px;margin:0 0 2px}
.hd p.s{color:#b9d6cb;margin:0}
.av{width:84px;height:84px;flex:0 0 84px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#0a4535}
h1{font-size:20px;margin:4px 0 2px}
p.s{margin:0 0 12px;color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
textarea{width:100%;min-height:150px;border:1px solid var(--bd);border-radius:10px;padding:10px;font:15px/1.4 inherit;background:rgba(0,0,0,.2);color:var(--tx);resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,label.b{flex:1 1 140px;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 15px inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
button:disabled{opacity:.45}
input[type=file]{display:none}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;min-width:1150px;width:100%;font-size:14px}
th{background:var(--pr);color:var(--prt);padding:8px;text-align:left;white-space:nowrap}
td{border-bottom:1px solid var(--bd);padding:2px}
td input{width:100%;border:0;background:transparent;color:var(--tx);font:14px inherit;padding:8px 6px;min-width:90px}
td.n{padding:8px;color:var(--mu);text-align:center}
td input.w{min-width:200px}
.note{color:var(--wa);font-size:12px;padding:4px 6px}
#msg{font-size:14px;color:var(--ok);min-height:20px;margin-top:8px}
#msg.e{color:var(--wa)}
.x{flex:0 0 40px;min-height:36px;font-size:18px}
</style>
</head>
<body>
<header class="hd"><div class="in"><div><h1>CCCD sang Excel</h1>

<div class="card">
<textarea id="in" placeholder="Dán nội dung vào đây. Có thể dán nhiều người một lúc."></textarea>
<div class="row">
<button class="p" id="go">Quét và thêm vào bảng</button>
<label class="b">Chọn file .txt<input type="file" id="f" accept=".txt,text/plain" multiple></label>
</div>
<div class="row">

</div>
<div class="s" id="hint" style="margin:8px 0 0;font-size:13px;color:var(--mu)"></div>
<div id="msg"></div>
</div>

<div class="card">
<div class="tw"><table>
<thead><tr><th>#</th><th>Họ và tên</th><th>Ngày sinh</th><th>Giới tính</th><th>Số CCCD</th><th>Số CMND</th><th>Ngày cấp</th><th>Ngày hết hạn</th><th>Địa chỉ</th><th>Quê quán</th><th>Ghi chú</th><th></th></tr></thead>
<tbody id="tb"></tbody>
</table></div>

<button id="clr" disabled>Xóa hết</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const L={
cccd:"S[ỐO]\\s*CCCD|S[ỐO]\\s*CĂN\\s*CƯỚC",
cmnd:"S[ốo]\\s*CMND|S[ốo]\\s*CMT",
ten:"H[ọo]\\s*(?:và|va)\\s*t[êe]n",
gioitinh:"Gi[ớo]i\\s*t[íi]nh",
ngaysinh:"Ng[àa]y\\s*sinh",
diachi:"N[ơo]i\\s*th[ưu][ờơo]ng\\s*tr[úu]|Đ[ịi]a\\s*ch[ỉi]",
ngaycap:"Ng[àa]y\\s*c[ấa]p(?:\\s*CCCD)?",
hethan:"Ng[àa]y\\s*h[ếe]t\\s*h[ạa]n|Có\\s*gi[áa]\\s*tr[ịi]\\s*đ[ếe]n"
};
const ALL=Object.values(L).map(p=>"(?:"+p+")").join("|");
const STOP="(?=(?:"+ALL+")|Thông tin này|Chia s|$)";
const rx={};for(const k in L)rx[k]=new RegExp("(?:"+L[k]+")\\s*[:\\n ]\\s*([\\s\\S]+?)"+STOP,"iu");
const pad=n=>String(n).padStart(2,"0");

function field(t,k){const m=t.match(rx[k]);return m?m[1].replace(/\s+/g," ").replace(/^[\s:,]+|[\s:,]+$/g,""):""}
function nd(s){const m=(s||"").match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);return m?pad(m[1])+"/"+pad(m[2])+"/"+m[3]:""}
function td(s){const m=s.match(/^(\d+)\/(\d+)\/(\d+)$/);return m?{d:+m[1],m:+m[2],y:+m[3]}:null}
function expiry(dob,iss){
 const b=td(dob),i=td(iss);if(!b||!i)return"";
 const age=i.y-b.y-((i.m<b.m||(i.m===b.m&&i.d<b.d))?1:0);
 for(const mk of [25,40,60])if(age<mk){let y=b.y+mk,m=b.m,d=b.d;
  if(m===2&&d===29&&!(new Date(y,1,29).getMonth()===1)){m=3;d=1}
  return pad(d)+"/"+pad(m)+"/"+y}
 return"Không thời hạn";
}
function parseZalo(text){
 text=text.replace(/\r/g,"");
 const cr=new RegExp("(?=(?:"+L.cccd+"))","iu"),ck=new RegExp(L.cccd,"iu");
 let blocks=text.split(cr).filter(b=>ck.test(b));
 if(!blocks.length)blocks=[text];
 return blocks.map(b=>{
  const r={};for(const k in L)r[k]=field(b,k);
  r.cccd=r.cccd.replace(/\D/g,"");r.cmnd=r.cmnd.replace(/\D/g,"");
  if(!r.cccd){const m=b.match(/\b(\d{4}\s?\d{4}\s?\d{4})\b/);r.cccd=m?m[1].replace(/\D/g,""):""}
  r.ngaysinh=nd(r.ngaysinh);r.ngaycap=nd(r.ngaycap);
  let ex=nd(r.hethan),notes=[],auto="";
  if(!ex){ex=expiry(r.ngaysinh,r.ngaycap);if(ex)auto="Hạn tự tính theo mốc tuổi 25/40/60"}
  r.hethan=ex;
  if(r.cccd&&r.cccd.length!==12)notes.push("Số CCCD không đủ 12 số");
  if(r.cmnd&&![9,12].includes(r.cmnd.length))notes.push("Số CMND bất thường");
  [["ten","họ tên"],["ngaysinh","ngày sinh"],["diachi","địa chỉ"]].forEach(([k,n])=>{if(!r[k])notes.push("thiếu "+n)});
  if(auto)notes.push(auto);
  r.ghichu=notes.join("; ");
  return r;
 });
}


const DRX=/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/g;
const JUNK=/(?:đ[ếeảa]n|đen|gi[áa]\s*\S+)\s*:?\s*\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{4}|Date\s*of\s*expiry\s*[-:]?|\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{4}/gi;
function cleanLines(s){
 return s.split("\n").filter(x=>!/^\s*(Có\s*)?gi[áa]\s/i.test(x)&&!/^\s*Date\s*of\s*expiry/i.test(x))
  .map(x=>x.replace(JUNK,"").trim()).filter(x=>x&&!/^[\W_]+$/.test(x));
}
function titleCase(s){return s.toLocaleLowerCase("vi").replace(/(^|\s)(\S)/gu,(m,a,b)=>a+b.toLocaleUpperCase("vi"))}
function parseFront(t){
 t=t.replace(/\r/g,"");
 const r={ten:"",ngaysinh:"",gioitinh:"",cccd:"",cmnd:"",ngaycap:"",hethan:"",diachi:"",quequan:"",ghichu:""};
 let m=t.match(/S[ốo]\s*\/\s*No\.?\s*:?\s*([\d ]{9,16})/i);
 r.cccd=m?m[1].replace(/\D/g,""):"";
 if(!r.cccd){m=t.match(/\b(\d{12})\b/);r.cccd=m?m[1]:""}
 m=t.match(/Sex\s*:?\s*(Nam|Nữ|Nu)/i);
 if(m)r.gioitinh=/^nam$/i.test(m[1])?"Nam":"Nữ";
 // họ tên: dòng IN HOA đầu tiên sau "Full name"
 const fi=t.search(/Full\s*name/i);
 if(fi>=0){
  const lines=t.slice(fi+9).split("\n").slice(0,8).map(x=>x.replace(/^[\s:]+/,"").trim());
  let nm=lines.find(s=>/^[\p{Lu}\s]{4,}$/u.test(s)&&/\s/.test(s));
  if(!nm)nm=lines.find(s=>/^[A-Za-zÀ-ỹ\s]{4,}$/u.test(s)&&!/(Ngày|Date|Giới|Quốc)/i.test(s));
  if(nm)r.ten=titleCase(nm.replace(/\s+/g," "));
 }
 // ngày: ngày hết hạn là ngày nằm trên dòng có "Có giá trị đến / Date of expiry"
 const flagged=[],plain=[];
 for(const x of t.matchAll(DRX)){
  const s=pad(x[1])+"/"+pad(x[2])+"/"+x[3];
  const ls=t.lastIndexOf("\n",x.index)+1,le=t.indexOf("\n",x.index);
  const line=t.slice(ls,le<0?t.length:le);
  (/gi[áa]|đ[ếeảa]n|đen|expiry/i.test(line)?flagged:plain).push({s,y:+x[3]});
 }
 if(/Kh[ôo]ng\s*th[ờo]i\s*h[ạa]n/i.test(t))r.hethan="Không thời hạn";
 else if(flagged.length)r.hethan=flagged[0].s;
 let cand=plain.filter(d=>d.s!==r.hethan);
 if(!r.hethan&&!flagged.length){
  const u=[...new Map(plain.map(d=>[d.s,d])).values()].sort((a,b)=>a.y-b.y);
  if(u.length>=2){r.hethan=u[u.length-1].s;cand=u.slice(0,-1)}
 }
 if(cand.length)r.ngaysinh=cand.sort((a,b)=>a.y-b.y)[0].s;
 // quê quán và nơi thường trú
 m=t.match(/Place\s*of\s*origin\s*:?\s*([\s\S]+?)(?=N[ơo]i\s*th[ưu][ờơo]ng|Place\s*of\s*residence|$)/i);
 if(m)r.quequan=cleanLines(m[1]).join(", ");
 m=t.match(/Place\s*of\s*residence\s*:?\s*([\s\S]*)$/i);
 if(m){
  let a=cleanLines(m[1]).reduce((acc,x)=>acc?(/,$/.test(acc)?acc+" "+x:acc+", "+x):x,"");
  if(r.quequan&&a.endsWith(r.quequan)&&a.length>r.quequan.length){
   const pre=a.slice(0,-r.quequan.length).trim().replace(/,$/,"");
   if(pre)a=pre+", "+r.quequan;
  }
  r.diachi=a;
 }
 const notes=[];
 if(r.cccd&&r.cccd.length!==12)notes.push("Số CCCD không đủ 12 số");
 [["ten","họ tên"],["ngaysinh","ngày sinh"],["diachi","địa chỉ"]].forEach(([k,n])=>{if(!r[k])notes.push("thiếu "+n)});
 const b=td(r.ngaysinh),e=td(r.hethan);
 if(b&&e&&(![25,40,60].includes(e.y-b.y)||e.d!==b.d||e.m!==b.m))notes.push("Ngày hết hạn không khớp quy tắc 25/40/60, kiểm tra lại OCR");
 r.ghichu=notes.join("; ");
 return r;
}
function parse(text){
 return /Full\s*name|Date\s*of\s*birth|Citizen\s*Identity/i.test(text)?[parseFront(text)]:parseZalo(text);
}
const KEYS=["ten","ngaysinh","gioitinh","cccd","cmnd","ngaycap","hethan","diachi","quequan","ghichu"];
const HEAD=["STT","Họ và tên","Ngày sinh","Giới tính","Số CCCD","Số CMND","Ngày cấp","Ngày hết hạn","Địa chỉ","Quê quán","Ghi chú"];
let rows=[];
const $=id=>document.getElementById(id);
function say(t,e){const m=$("msg");m.textContent=t;m.className=e?"e":""}

function render(){
 const tb=$("tb");tb.textContent="";
 rows.forEach((r,i)=>{
  const tr=document.createElement("tr");
  const n=document.createElement("td");n.className="n";n.textContent=i+1;tr.appendChild(n);
  KEYS.forEach(k=>{
   const td=document.createElement("td"),inp=document.createElement("input");
   inp.value=r[k]||"";if(k==="diachi"||k==="ghichu"||k==="quequan")inp.className="w";
   if(["cccd","cmnd"].includes(k))inp.inputMode="numeric";
   inp.addEventListener("input",()=>{r[k]=inp.value});
   td.appendChild(inp);tr.appendChild(td);
  });
  const d=document.createElement("td"),b=document.createElement("button");
  b.className="x";b.textContent="×";b.setAttribute("aria-label","Xóa dòng");
  b.onclick=()=>{rows.splice(i,1);render()};d.appendChild(b);tr.appendChild(d);
  tb.appendChild(tr);
 });
 $("empty").style.display=rows.length?"none":"block";
 $("dl").disabled=$("clr").disabled=!rows.length;
}

function add(text){
 const got=parse(text).filter(r=>r.cccd||r.cmnd||r.ten);
 if(!got.length){say("Không tìm thấy thông tin CCCD trong nội dung này.",1);return 0}
 rows=rows.concat(got);render();return got.length;
}
$("go").onclick=()=>{
 const t=$("in").value.trim();if(!t){say("Hãy dán nội dung trước.",1);return}
 const n=add(t);if(n){say("Đã thêm "+n+" dòng.");$("in").value=""}
};
$("f").onchange=async e=>{
 let n=0;
 for(const f of e.target.files){try{n+=add(await f.text())}catch(x){}}
 if(n)say("Đã thêm "+n+" dòng từ file.");
 e.target.value="";
};
$("clr").onclick=()=>{rows=[];render();say("")};
function saveBlob(name,blob){
 const u=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),4000);
}
$("dl").onclick=()=>{
 try{
  if(window.XLSX){
   const aoa=[HEAD].concat(rows.map((r,i)=>[i+1].concat(KEYS.map(k=>String(r[k]||"")))));
   const ws=XLSX.utils.aoa_to_sheet(aoa);
   ws["!cols"]=[5,22,12,9,16,14,12,14,42,30,34].map(w=>({wch:w}));
   const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"CCCD");
   const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
   saveBlob("ket_qua_cccd.xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
   say("Đã tạo file Excel.");
  }else{
   const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
   const lines=[HEAD.map(q).join(",")].concat(rows.map((r,i)=>[i+1].concat(KEYS.map(k=>"\t"+(r[k]||""))).map(q).join(",")));
   saveBlob("ket_qua_cccd.csv",new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));
   say("Chưa có mạng nên đã xuất file CSV (mở được bằng Excel).",1);
  }
 }catch(err){say("Không tạo được file. Thử lại sau.",1)}
};
let SAMPLE=null;
(async()=>{
 try{if(typeof claude!=="undefined"){const s=await claude.use("sample");if(s&&(await s.limits()).images)SAMPLE=s}}catch(e){}
 $("hint").textContent=SAMPLE?"Ảnh được gửi cho Claude (tài khoản của bạn) để đọc chữ, rồi app tự điền bảng. Chụp rõ nét, đủ sáng, không bị lóa.":(window.Tesseract?"Ảnh được đọc ngay trên máy bạn. Chụp rõ nét, đủ sáng, không bị lóa.":"");
})();
function shrink(file,max){
 return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
   const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
   c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.88);
  };
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};
  im.src=u;
 });
}
async function ocr(file){
 const b=await shrink(file,2000);
 if(SAMPLE){
  const r=await SAMPLE("Chép lại nguyên văn toàn bộ chữ nhìn thấy trong ảnh này (thường là mặt trước hoặc mặt sau căn cước công dân, hoặc màn hình thông tin căn cước). Giữ đúng thứ tự và xuống dòng, giữ cả các nhãn như 'Họ và tên / Full name', 'Số / No.', 'Ngày sinh', 'Nơi thường trú'. Chỉ trả về phần chữ, không giải thích, không thêm bớt.",{images:[b],modelTier:"default"});
  return r.text;
 }
 if(window.Tesseract){const r=await Tesseract.recognize(b,"vie");return r.data.text}
 throw new Error("none");
}
async function scanImages(files){
 if(!files.length)return;
 let n=0;
 for(let i=0;i<files.length;i++){
  say("Đang đọc ảnh "+(i+1)+"/"+files.length+"...");
  try{
   const t=await ocr(files[i]);
   const c=add(t);
   if(!c){$("in").value=t;say("Đã đọc ảnh nhưng chưa nhận ra thông tin CCCD. Chữ đọc được nằm trong ô nhập để bạn kiểm tra.",1)}
   n+=c;
  }catch(e){
   say(e&&e.code==="not_granted"?"Bạn chưa cho phép Claude đọc ảnh.":(e&&e.message==="none"?"Quét ảnh cần mở trang trong ứng dụng Claude hoặc có kết nối mạng.":"Không đọc được ảnh. Thử ảnh rõ nét hơn."),1);
   return;
  }
 }
 if(n)say("Đã thêm "+n+" dòng từ ảnh. Hãy kiểm tra lại các ô trước khi tải Excel.");
}
$("cam").onchange=e=>{const fs=[...e.target.files];e.target.value="";scanImages(fs)};
render();
</script>
